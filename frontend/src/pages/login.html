<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <title>登录 - TravelSmart</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- 引用统一css样式文件 -->
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="login-container">
        <h1>登录</h1>
        <form class="login-form" id="loginForm" action="/login" method="post" autocomplete="on">
            <div id="errmsg" class="form-group errmsg"></div>
            <div class="form-group">
                <label for="username">用户名/邮箱</label>
                <input type="text" id="username" name="username" placeholder="请输入用户名或邮箱" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" placeholder="请输入密码" required autocomplete="current-password">
            </div>
            <button class="btn btn-primary" type="submit">登录</button>
        </form>
        <div class="link-row">
            <a href="/index/" class="link">返回首页</a>
            <span>|</span>
            <a href="/register" class="link">没有账号？注册</a>
        </div>
    </div>
</body>
<script src="/static/login.js"></script>
</html>
