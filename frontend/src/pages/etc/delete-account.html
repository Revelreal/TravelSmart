<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>注销账号</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/static/etc/delete-account.css">
</head>
<body>
    <div class="logout-container">
        <div class="logout-card">
            <div class="logout-avatar">
                <img src="/static/default-avatar.png" alt="头像" />
            </div>
            <h2>确定要注销账号吗？</h2>
            <p class="tip">注销后您的账号数据将被永久删除，无法恢复。<br>请谨慎操作！</p>
            <form id="logout-form" method="POST">
                <button type="submit" class="logout-btn">注销账号</button>
                <button type="button" class="cancel-btn" onclick="window.location.href='/'">取消</button>
            </form>
        </div>
    </div>
    <script src="/static/etc/logout.js"></script>
</body>
</html>
