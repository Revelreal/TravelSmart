<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>注册 - TravelSmart</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- 主样式 -->
    <link rel="stylesheet" href="/static/styles.css">
    <!-- 注册专属样式 -->
    <link rel="stylesheet" href="/static/register.css">
</head>
<body>
    <div class="container" style="max-width:420px;">
        <div class="form-title">注册账号</div>
        <form id="registerForm" autocomplete="off" novalidate>
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" class="form-control" name="username" required minlength="3" maxlength="16" placeholder="请输入用户名">
                <span class="form-tip" id="userTip"></span>
            </div>
            <div class="form-group">
                <label for="email">邮箱</label>
                <input type="email" id="email" class="form-control" name="email" required placeholder="请输入邮箱地址">
                <span class="form-tip" id="emailTip"></span>
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" class="form-control" name="password" required minlength="6" maxlength="20" placeholder="请输入6-20位密码">
                <span class="form-tip" id="pwdTip"></span>
            </div>
            <div class="form-group">
                <label for="confirm">确认密码</label>
                <input type="password" id="confirm" class="form-control" required placeholder="请再次输入密码">
                <span class="form-tip" id="cpwdTip"></span>
            </div>
            <button type="submit" class="submit-btn">注册</button>
        </form>
        <div class="go-login">已有账号？ <a href="/login">去登录</a></div>
    </div>
    <!-- 分离JS -->
    <script src="/static/register.js"></script>
</body>
</html>
